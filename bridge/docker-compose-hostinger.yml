services:
  ella-gpt-live-bridge:
    build:
      context: https://github.com/cs6-art/ella-recruitment-portal-pilot.git#main
      dockerfile: Dockerfile.gpt-live-bridge
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      LIVEAVATAR_API_URL: "https://api.liveavatar.com"
      LIVEAVATAR_API_KEY: ""
      LIVEAVATAR_AVATAR_ID: "998e5637-cfca-4700-891e-8a40ce33f562"
      OPENAI_API_KEY: ""
      GPT_LIVE_MODEL: "gpt-live-1"
      GPT_LIVE_VOICE: "marin"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
