    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.42, ease: "power3.in" }, 3);
        tl.fromTo("#el-02-reveal", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power3.out" }, 3);
        tl.to("#el-02-reveal", { x: -1920, duration: 0.34, ease: "power3.inOut" }, 6);
        tl.fromTo("#el-03-screening", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.34, ease: "power3.inOut" }, 6);
        tl.to("#el-03-screening", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.42, ease: "power3.in" }, 10);
        tl.fromTo("#el-04-interviews", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power3.out" }, 10);
        tl.to("#el-04-interviews", { y: -1080, duration: 0.34, ease: "power3.inOut" }, 15);
        tl.fromTo("#el-05-review", { y: 1080, opacity: 1 }, { y: 0, opacity: 1, duration: 0.34, ease: "power3.inOut" }, 15);
        tl.to("#el-05-review", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.38, ease: "power3.in" }, 19);
        tl.fromTo("#el-06-workflow", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.38, ease: "power3.out" }, 19);
        tl.to("#el-06-workflow", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.42, ease: "power3.in" }, 22);
        tl.fromTo("#el-07-close", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power3.out" }, 22);
        tl.to({}, { duration: 25 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
